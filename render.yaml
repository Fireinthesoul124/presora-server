databases:
  - name: presora-db
    region: singapore
    plan: starter
    postgresMajorVersion: "16"

services:
  - type: web
    name: presora-server
    region: singapore
    runtime: node
    plan: starter
    buildCommand: npm install && npm run build && npx prisma migrate deploy
    startCommand: npm start
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: presora-db
          property: connectionString
      - key: JWT_ACCESS_SECRET
        generateValue: true
      - key: ANTHROPIC_API_KEY
        sync: false
      - key: R2_ACCOUNT_ID
        sync: false
      - key: R2_ACCESS_KEY_ID
        sync: false
      - key: R2_SECRET_ACCESS_KEY
        sync: false
      - key: R2_BUCKET
        value: presora
      - key: R2_PUBLIC_BASE_URL
        sync: false
      - key: RESEND_API_KEY
        sync: false
      - key: EMAIL_FROM
        value: "Presora <onboarding@resend.dev>"
      - key: NODE_ENV
        value: production
